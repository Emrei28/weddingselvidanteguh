<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Pembuat Link Undangan</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--m:#6b0f1a;--red:#c8102e;--ivory:#fbf5e9;--gold:#b8923a;--ink:#2b1a14;--leaf:#1f6b46}
*{box-sizing:border-box;margin:0}
body{font:17px/1.6 "Nunito Sans",system-ui,sans-serif;color:var(--ink);background:var(--ivory)}
.band{height:14px;background:linear-gradient(135deg,var(--gold) 25%,transparent 25%) -7px 0/14px 14px,linear-gradient(225deg,var(--gold) 25%,transparent 25%) -7px 0/14px 14px,var(--m)}
main{max-width:640px;margin:auto;padding:32px 18px 80px;display:grid;gap:14px}
h1{font:700 2.1rem/1.2 "Cormorant Garamond",serif;color:var(--m)}
.sub{color:#6d5b4d}
label{display:grid;gap:6px;font-weight:600}label small{font-weight:400;color:#8a7a68}
textarea,input{font:inherit;width:100%;padding:12px 14px;border:1.5px solid #d9c9a8;border-radius:12px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font:600 1rem inherit;min-height:46px;padding:10px 22px;border:0;border-radius:99px;background:var(--m);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--red)}.btn.ghost{background:none;color:var(--m);border:1.5px solid var(--m)}.btn.ghost:hover{background:var(--m);color:#fff}
.btn.wa{background:var(--leaf)}.btn.wa:hover{background:#17553a}
#go{min-height:52px}
#out{display:grid;gap:14px}
.card{background:#fff;border:1px solid rgba(184,146,58,.55);border-radius:16px;padding:18px;display:grid;gap:12px;box-shadow:0 8px 24px rgba(107,15,26,.07)}
.card h2{font:700 1.35rem "Cormorant Garamond",serif;color:var(--m)}
.link{font-size:.9rem;word-break:break-all;color:#6d5b4d}
pre{white-space:pre-wrap;font:inherit;font-size:.95rem;background:var(--ivory);border-radius:12px;padding:14px;max-height:220px;overflow:auto}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts .btn{flex:1 1 140px}
details{background:#fff;border:1px solid #e6d9bd;border-radius:14px;padding:12px 16px}
details[open]{display:grid;gap:12px}summary{cursor:pointer;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;translate:-50% 160%;background:var(--leaf);color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;transition:translate .35s}
#toast.show{translate:-50% 0}
</style>
</head>
<body>
<div class="band"></div>
<main>
  <h1>Pembuat Link Undangan</h1>
  <p class="sub">Tulis nama tamu, klik tombol, lalu salin pesannya atau kirim langsung lewat WhatsApp.</p>
  <label for="names">Nama tamu <small>(satu nama per baris, boleh banyak sekaligus)</small>
    <textarea id="names" rows="4" placeholder="Bapak Budi Santoso&#10;Keluarga Besar Pak Herman"></textarea>
  </label>
  <button class="btn" id="go" type="button">Buat Link Undangan</button>
  <div id="out" aria-live="polite"></div>
  <details>
    <summary>Pengaturan pesan dan alamat undangan</summary>
    <label for="base">Alamat undangan <small>(terisi otomatis, ubah hanya jika perlu)</small><input id="base"></label>
    <label for="tpl">Isi pesan <small>Kode yang bisa dipakai: {nama} {link} {pasangan} {tanggal}</small><textarea id="tpl" rows="14"></textarea></label>
    <button class="btn ghost" id="reset" type="button">Kembalikan pesan awal</button>
  </details>
</main>
<div id="toast" role="status"></div>
<script>
/* ===== UBAH DI SINI: nama pasangan, tanggal, dan isi pesan awal ===== */
const COUPLE = "Selvi & Ichsan";
const DATE_TEXT = "Rabu, 18 November 2026";
const DEFAULT_TPL = `Assalamu'alaikum Warahmatullahi Wabarakatuh

Kepada Yth.
{nama}

Dengan memohon rahmat dan ridho Allah SWT, kami bermaksud mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:

{pasangan}
{tanggal}

Informasi lengkap acara dapat dilihat melalui link undangan berikut:
{link}

Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.

Wassalamu'alaikum Warahmatullahi Wabarakatuh
{pasangan}`;

/* ===== LOGIKA ===== */
const $ = s => document.querySelector(s);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
$("#base").value = new URL("./", location.href).href;     // alamat folder tempat halaman ini berada
$("#tpl").value = store.get("tpl") || DEFAULT_TPL;
$("#tpl").oninput = e => store.set("tpl", e.target.value);
$("#reset").onclick = () => { $("#tpl").value = DEFAULT_TPL; store.set("tpl", DEFAULT_TPL); toast("Pesan dikembalikan"); };

function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("show"), 2000); }
async function copy(t) {
  try { await navigator.clipboard.writeText(t); }
  catch { const a = document.createElement("textarea"); a.value = t; document.body.append(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Berhasil disalin");
}
function el(tag, props = {}, ...kids) { const e = Object.assign(document.createElement(tag), props); kids.forEach(k => e.append(k)); return e; }

function makeLink(name) {
  return `${$("#base").value.trim()}?to=${encodeURIComponent(name).replace(/%20/g, "+")}`;
}
function makeMessage(name, link) {
  return $("#tpl").value.replaceAll("{nama}", name).replaceAll("{link}", link).replaceAll("{pasangan}", COUPLE).replaceAll("{tanggal}", DATE_TEXT);
}
$("#go").onclick = () => {
  const names = [...new Set($("#names").value.split("\n").map(n => n.trim()).filter(Boolean))];
  if (!names.length) { toast("Tulis minimal satu nama"); $("#names").focus(); return; }
  const out = $("#out"); out.replaceChildren();
  names.forEach(name => {
    const link = makeLink(name), msg = makeMessage(name, link);
    const btn = (t, cls, fn) => el("button", { className: "btn " + cls, type: "button", textContent: t, onclick: fn });
    out.append(el("article", { className: "card" },
      el("h2", { textContent: name }),
      el("p", { className: "link", textContent: link }),
      el("pre", { textContent: msg }),
      el("div", { className: "acts" },
        btn("Salin Pesan", "", () => copy(msg)),
        btn("Salin Link", "ghost", () => copy(link)),
        el("a", { className: "btn wa", target: "_blank", rel: "noopener", textContent: "Kirim lewat WhatsApp", href: "https://wa.me/?text=" + encodeURIComponent(msg) }))));
  });
  out.firstChild.scrollIntoView({ behavior: "smooth", block: "start" });
  
};
</script>
</body>
</html>
